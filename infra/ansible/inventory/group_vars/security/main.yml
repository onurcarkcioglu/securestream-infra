---
# ss-sec: AppSec araclari (DefectDojo; SonarQube Item 4). Surumler burada sabit; ~2 hafta bekleme kurali.
appsec_docker_version: "29.1.3-0ubuntu3~24.04.2"
appsec_compose_version: "2.40.3+ds1-0ubuntu1~24.04.1"

# DefectDojo 3.3.300 (2026-09-28). 3.4.x daha yeni; notlarinda guvenlik duzeltmesi yok.
# Imajlar coklu mimari index digest'i ile; postgres ve valkey resmi compose dosyasindaki digest'ler.
defectdojo_version: "3.3.300"
defectdojo_django_image: "defectdojo/defectdojo-django:3.3.300@sha256:6516f0f620867b76df766c5adb94a7538ef7c37560102c7b4d7ce4844993261c"
defectdojo_nginx_image: "defectdojo/defectdojo-nginx:3.3.300@sha256:2804d871ed730caae7c8c524dbb663eb4c500dec48ce92a2773cf880e3389e1d"
defectdojo_postgres_image: "postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2"
defectdojo_valkey_image: "valkey/valkey:9.1.2-alpine@sha256:a174b894902bd3367e330d47cc2054367dc4917701776aaf336f41d83b65ec7a"
defectdojo_hostname: "defectdojo.{{ lab_domain }}"

# Gizli degerler vault.yml'de (yalnizca pipe ile uretildi)
defectdojo_secret_key: "{{ vault_dd_secret_key }}"
defectdojo_credential_aes_key: "{{ vault_dd_credential_aes_key }}"
defectdojo_db_password: "{{ vault_dd_db_password }}"
defectdojo_admin_password: "{{ vault_dd_admin_password }}"
defectdojo_jira_webhook_secret: "{{ vault_dd_jira_webhook_secret }}"
