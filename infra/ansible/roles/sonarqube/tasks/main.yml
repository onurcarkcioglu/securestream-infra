---
# SonarQube ilk sifresi admin/admin; bootstrap ilk calismada vault'taki sifreye cevirir.
# Karmasiklik kurali (12+ karakter, buyuk/kucuk harf, rakam, ozel karakter) betikte kontrol edilir.
- name: Gizli degerler tanimli olmali (vault.yml)
  ansible.builtin.assert:
    that:
      - sonarqube_admin_password | length >= 32
      - sonarqube_db_password | length >= 32
    fail_msg: "group_vars/security/vault.yml eksik ya da kisa (deger basilmaz)"
  no_log: true

- name: SonarQube klasoru
  ansible.builtin.file:
    path: "{{ sonarqube_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Gizli env dosyalari (loga yazilmaz)
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ sonarqube_dir }}/{{ item }}"
    owner: root
    group: root
    mode: "0600"
  loop: [sonarqube.env, postgres.env, admin.env]
  no_log: true

- name: docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ sonarqube_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0640"
  register: sonarqube_compose_file

- name: TLS sertifikasi (lab CA; anahtar sunucudan cikmaz)
  ansible.builtin.include_role:
    name: lab_cert
  vars:
    lab_cert_name: sonarqube
    lab_cert_sans:
      - "DNS:{{ sonarqube_hostname }}"

- name: nginx sanal sunucusu (443)
  ansible.builtin.template:
    src: nginx-sonarqube.conf.j2
    dest: /etc/nginx/sites-available/sonarqube.conf
    owner: root
    group: root
    mode: "0644"
  notify: reload nginx

- name: nginx sanal sunucusu acik
  ansible.builtin.file:
    src: /etc/nginx/sites-available/sonarqube.conf
    dest: /etc/nginx/sites-enabled/sonarqube.conf
    state: link
  notify: reload nginx
  # Check modunda hedef dosya henuz yoksa link olusturulamaz
  when: not ansible_check_mode

- name: Docker kurulu mu (ilk calismada check modunda yok)
  ansible.builtin.stat:
    path: /usr/bin/docker
  register: sonarqube_docker

- name: SonarQube konteynerleri
  community.docker.docker_compose_v2:
    project_src: "{{ sonarqube_dir }}"
    state: present
    pull: missing
  # Ilk check calismasinda compose dosyasi henuz yazilmadi
  when: sonarqube_docker.stat.exists and not (ansible_check_mode and sonarqube_compose_file is changed)

- name: Handler'lari simdi calistir
  ansible.builtin.meta: flush_handlers

- name: SonarQube TLS uzerinden hazir (ilk acilista indeksleme suruyor)
  ansible.builtin.uri:
    url: "https://{{ sonarqube_hostname }}/api/system/status"
    return_content: true
  register: sonarqube_status
  until: sonarqube_status.json is defined and sonarqube_status.json.status == "UP"
  retries: "{{ sonarqube_wait_retries }}"
  delay: 10
  when: not ansible_check_mode

- name: Yonetim betigi
  ansible.builtin.copy:
    src: sonar-admin.py
    dest: "{{ sonarqube_dir }}/sonar-admin.py"
    owner: root
    group: root
    mode: "0700"

# Admin sifresi, quality gate, proje, CI kullanicisi, yetkiler (API, idempotent).
# Sifre yalnizca 0600 admin.env'den okunur; cikti OK/CHANGED satirlari.
- name: SonarQube yapilandirmasi (API)
  ansible.builtin.command:
    cmd: python3 {{ sonarqube_dir }}/sonar-admin.py bootstrap https://{{ sonarqube_hostname }}
  register: sonarqube_bootstrap
  changed_when: "'CHANGED' in sonarqube_bootstrap.stdout"
  when: not ansible_check_mode

- name: Bootstrap sonucu
  ansible.builtin.debug:
    var: sonarqube_bootstrap.stdout_lines
  when: not ansible_check_mode
