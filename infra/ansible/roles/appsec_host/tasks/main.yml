---
- name: Surumler secilmis olmali
  ansible.builtin.assert:
    that:
      - appsec_docker_version | length > 0
      - appsec_compose_version | length > 0
    fail_msg: "appsec_docker_version / appsec_compose_version bos (group_vars/security/main.yml)."

- name: Docker Engine, compose eklentisi ve nginx (sabit surum)
  ansible.builtin.apt:
    name:
      - "docker.io={{ appsec_docker_version }}"
      - "docker-compose-v2={{ appsec_compose_version }}"
      - nginx
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Docker surumu kilitli (apt upgrade ile kendiliginden yukselmez)
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop: [docker.io, docker-compose-v2]
  when: not ansible_check_mode

# Konteyner ulimit'leri: SonarQube/Elasticsearch en az 131072 dosya, 8192 surec ister
- name: Docker daemon ayarlari (gunluk siniri, ulimit)
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "log-driver": "json-file",
        "log-opts": { "max-size": "10m", "max-file": "3" },
        "live-restore": true,
        "default-ulimits": {
          "nofile": { "Name": "nofile", "Soft": {{ appsec_nofile }}, "Hard": {{ appsec_nofile }} },
          "nproc": { "Name": "nproc", "Soft": {{ appsec_nproc }}, "Hard": {{ appsec_nproc }} }
        }
      }
    owner: root
    group: root
    mode: "0644"
  notify: restart docker

- name: Docker servisi acik
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started
  when: not ansible_check_mode

- name: Mevcut cekirdek degerleri
  ansible.builtin.command: sysctl -n vm.max_map_count fs.file-max
  register: appsec_sysctl_now
  changed_when: false
  check_mode: false

- name: Cekirdek ayarlari (kalici)
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/90-appsec.conf
    reload: true
  loop:
    - name: vm.max_map_count
      value: "{{ [appsec_sysctl_now.stdout_lines[0] | int, appsec_vm_max_map_count_min] | max }}"
    - name: fs.file-max
      value: "{{ [appsec_sysctl_now.stdout_lines[1] | int, appsec_fs_file_max] | max }}"
  loop_control:
    label: "{{ item.name }}"

# Yalnizca 443 (her uygulama rolu kendi sanal sunucusunu ekler); varsayilan 80 sitesi kalkar
- name: Varsayilan nginx sitesi kapali
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: reload nginx

# Ubuntu'nun nginx.conf'u http seviyesinde TLSv1 ve TLSv1.1'i de acar; ayni yonerge conf.d'de tekrar edilemez
- name: nginx.conf var mi (yeni sunucuda check modunda yok)
  ansible.builtin.stat:
    path: /etc/nginx/nginx.conf
  register: appsec_nginx_conf

- name: Yalnizca TLS 1.2 ve 1.3 (nginx.conf)
  ansible.builtin.lineinfile:
    path: /etc/nginx/nginx.conf
    regexp: '^\s*ssl_protocols\s'
    line: "\tssl_protocols TLSv1.2 TLSv1.3;"
  notify: reload nginx
  when: appsec_nginx_conf.stat.exists

- name: Ortak TLS ayarlari
  ansible.builtin.copy:
    dest: /etc/nginx/conf.d/tls.conf
    content: |
      # Ansible tarafindan yonetilir (roles/appsec_host). ssl_protocols: nginx.conf
      ssl_session_tickets off;
      server_tokens off;
    owner: root
    group: root
    mode: "0644"
  notify: reload nginx

# Bilinmeyen isimle gelen TLS baglantisi el sikismada reddedilir (ilk sanal sunucu varsayilan olmaz)
- name: Varsayilan 443 sunucusu (SNI eslesmezse reddet)
  ansible.builtin.copy:
    dest: /etc/nginx/conf.d/default-443.conf
    content: |
      # Ansible tarafindan yonetilir (roles/appsec_host)
      server {
          listen 443 ssl default_server;
          listen [::]:443 ssl default_server;
          ssl_reject_handshake on;
      }
    owner: root
    group: root
    mode: "0644"
  notify: reload nginx

- name: nginx servisi acik
  ansible.builtin.systemd:
    name: nginx
    enabled: true
    state: started
  when: not ansible_check_mode
