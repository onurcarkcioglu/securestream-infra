---
# Check modunda atlanir: yeni sunucuda servis henuz kurulu degil
- name: restart docker
  ansible.builtin.systemd:
    name: docker
    state: restarted
  when: not ansible_check_mode

# Once sozdizimi testi: bozuk ayar calisan nginx'i durdurmaz, handler kirmizi olur
- name: reload nginx
  ansible.builtin.shell: nginx -t && systemctl reload nginx
  when: not ansible_check_mode
