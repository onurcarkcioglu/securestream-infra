---
- name: Gizli degerler tanimli olmali (vault.yml)
  ansible.builtin.assert:
    that:
      - defectdojo_secret_key | length >= 32
      - defectdojo_credential_aes_key | length >= 32
      - defectdojo_db_password | length >= 32
      - defectdojo_admin_password | length >= 32
      - defectdojo_jira_webhook_secret | length >= 32
    fail_msg: "group_vars/security/vault.yml eksik ya da kisa (deger basilmaz)"
  no_log: true

- name: DefectDojo klasorleri
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  loop:
    - "{{ defectdojo_dir }}"
    - "{{ defectdojo_dir }}/extra_settings"

- name: Gizli env dosyalari (loga yazilmaz)
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ defectdojo_dir }}/{{ item }}"
    owner: root
    group: root
    mode: "0600"
  loop: [defectdojo.env, initializer.env, postgres.env]
  no_log: true

- name: docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ defectdojo_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0640"

- name: TLS sertifikasi (lab CA; anahtar sunucudan cikmaz)
  ansible.builtin.include_role:
    name: lab_cert
  vars:
    lab_cert_name: defectdojo
    lab_cert_sans:
      - "DNS:{{ defectdojo_hostname }}"

- name: nginx sanal sunucusu (443)
  ansible.builtin.template:
    src: nginx-defectdojo.conf.j2
    dest: /etc/nginx/sites-available/defectdojo.conf
    owner: root
    group: root
    mode: "0644"
  notify: reload nginx

- name: nginx sanal sunucusu acik
  ansible.builtin.file:
    src: /etc/nginx/sites-available/defectdojo.conf
    dest: /etc/nginx/sites-enabled/defectdojo.conf
    state: link
  notify: reload nginx
  # Check modunda hedef dosya henuz yoksa link olusturulamaz
  when: not ansible_check_mode

- name: Docker kurulu mu (ilk calismada check modunda yok)
  ansible.builtin.stat:
    path: /usr/bin/docker
  register: defectdojo_docker

- name: DefectDojo konteynerleri
  community.docker.docker_compose_v2:
    project_src: "{{ defectdojo_dir }}"
    state: present
    pull: missing
  register: defectdojo_compose
  # "up" bitmis initializer'i her calismada yeniden baslatir (resmi tasarim: migration kontrolu).
  # Yalnizca bu ise degisiklik sayilmaz; diger konteynerlerdeki her islem sayilir.
  changed_when: >-
    defectdojo_compose.actions | default([])
    | rejectattr('id', 'search', '-initializer-') | list | length > 0
  when: defectdojo_docker.stat.exists

- name: Handler'lari simdi calistir
  ansible.builtin.meta: flush_handlers

- name: DefectDojo TLS uzerinden cevap veriyor (ilk acilista migration suruyor)
  ansible.builtin.uri:
    url: "https://{{ defectdojo_hostname }}/login"
    status_code: 200
  register: defectdojo_login
  until: defectdojo_login.status == 200
  retries: "{{ defectdojo_wait_retries }}"
  delay: 10
  when: not ansible_check_mode

- name: Bootstrap betigi
  ansible.builtin.copy:
    src: dd-bootstrap.py
    dest: "{{ defectdojo_dir }}/dd-bootstrap.py"
    owner: root
    group: root
    mode: "0700"

# Admin API token'i konteynerdeki Django'dan pipe ile betige gider; komut satirina, loga ve diske girmez.
# Token 80 gunden eskiyse yenilenir (sure 90 gun).
- name: Urunler, CI/CD engagement, SLA, CI kullanicisi (API, idempotent)
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      docker compose -f {{ defectdojo_dir }}/docker-compose.yml exec -T uwsgi python manage.py shell -c '
      import datetime
      from django.contrib.auth import get_user_model
      from django.utils import timezone
      from rest_framework.authtoken.models import Token
      u = get_user_model().objects.get(username="{{ defectdojo_admin_user }}")
      t = Token.objects.filter(user=u).first()
      if t is None or timezone.now() - t.created > datetime.timedelta(days=80):
          Token.objects.filter(user=u).delete()
          t = Token.objects.create(user=u)
      print("TOKEN " + t.key)
      ' 2>/dev/null | sed -n 's/^TOKEN \([0-9a-f]\{40\}\)$/\1/p' | python3 {{ defectdojo_dir }}/dd-bootstrap.py https://{{ defectdojo_hostname }}
    executable: /bin/bash
  register: defectdojo_bootstrap
  changed_when: "'CHANGED' in defectdojo_bootstrap.stdout"
  when: not ansible_check_mode

- name: Bootstrap sonucu
  ansible.builtin.debug:
    var: defectdojo_bootstrap.stdout_lines
  when: not ansible_check_mode

# Kullanici API ile sifresiz olusturulamiyor; rastgele sifre burada kullanilamaz hale getirilir (Django API'si)
- name: CI kullanicisi arayuze giris yapamaz (kullanilamaz sifre, staff degil)
  ansible.builtin.command:
    cmd: >-
      docker compose -f {{ defectdojo_dir }}/docker-compose.yml exec -T uwsgi python manage.py shell -c
      'from django.contrib.auth import get_user_model;
      u = get_user_model().objects.get(username="gitlab-ci");
      assert not u.is_superuser and not u.is_staff, "gitlab-ci must not be staff or superuser";
      c = u.has_usable_password();
      c and u.set_unusable_password();
      c and u.save(update_fields=["password"]);
      print("CHANGED" if c else "OK")'
  register: defectdojo_ci_user
  changed_when: "'CHANGED' in defectdojo_ci_user.stdout"
  when: not ansible_check_mode
