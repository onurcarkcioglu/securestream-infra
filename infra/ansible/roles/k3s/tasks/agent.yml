---
- name: Worker ayarı
  ansible.builtin.template:
    src: config-agent.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    mode: "0600"
  no_log: true
  diff: false   # icerik gizli (token / istemci anahtari): --diff de basmamali
  notify: k3s yeniden başlat

- name: Control plane'in hazır olmasını bekle
  ansible.builtin.wait_for:
    host: "{{ k3s_server_ip }}"
    port: 6443
    timeout: 300

- name: k3s agent kur
  ansible.builtin.include_tasks: install.yml
  vars:
    k3s_install_role: agent

- name: k3s-agent servisi çalışsın
  ansible.builtin.service:
    name: k3s-agent
    enabled: true
    state: started
