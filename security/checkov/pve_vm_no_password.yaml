# Proxmox VMs get SSH keys from cloud-init, never a password.
metadata:
  id: "CKV2_SS_1"
  name: "Proxmox VM cloud-init user must not have a password"
  category: "IAM"
  severity: "HIGH"
definition:
  cond_type: "attribute"
  resource_types: ["proxmox_virtual_environment_vm"]
  attribute: "initialization.user_account.password"
  operator: "not_exists"
