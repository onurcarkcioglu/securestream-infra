# securestream-infra pipeline
# - secret-scan:    her push'ta bu commit'in tum gecmisi gitleaks ile taranir.
# - iac-scan:       infra/terraform (samples/*/insecure haric) Checkov + ozel kurallar; istisnasiz bulgu durdurur.
# - iac-scan-insecure: kasitli guvensiz bulut ornekleri; yakalanan kurallari listeler, kapi degil.
# - publish-github: yalnizca main. Secret dosyalari (sifreli olsalar bile) TUM gecmisten cikarilir,
#                   sonuc tekrar taranir ve ancak temizse GitHub'a gonderilir. Bkz. docs/adr/0008.
workflow:
  rules:
    - if: $CI_COMMIT_BRANCH

stages: [scan, publish]

variables:
  GITLEAKS_IMAGE: "ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f"
  # catalog-api ile ayni digest (bridgecrew/checkov:3.3.26)
  CHECKOV_IMAGE: "bridgecrew/checkov:3.3.26@sha256:8e63f217cb084f1c1a067326a9cf6e37d54bdc82e5822210d50ca4e2f647dd93"
  GITHUB_USER: "onurcarkcioglu"

default:
  tags: [docker]

secret-scan:
  stage: scan
  image:
    name: $GITLEAKS_IMAGE
    entrypoint: [""]
  variables:
    GIT_DEPTH: "0"
    GIT_STRATEGY: clone
  script:
    - gitleaks git --log-opts="$CI_COMMIT_SHA" --redact .
  # Ozel repoda sifreli Ansible Vault dosyalari var; asil kapi publish-github'daki temiz kopya taramasi.
  allow_failure: true

.checkov:
  stage: scan
  needs: []
  image:
    name: $CHECKOV_IMAGE
    entrypoint: [""]
  artifacts:
    when: always
    paths: [iac-reports/]
    expire_in: 30 days

iac-scan:
  extends: .checkov
  script:
    # Checkov rapor modunda; karari scan-gate.py verir (istisnasiz bulgu, bos rapor -> kirmizi).
    - bash scripts/iac-scan.sh gate

iac-scan-insecure:
  extends: .checkov
  script:
    # Kapi degil: guvensiz ornekler tarayicinin neyi yakaladigini gosterir; betik her zaman exit 0.
    - bash scripts/iac-scan.sh report

publish-github:
  stage: publish
  # IaC kapisi kirmiziysa yayin yapilmaz. secret-scan bilerek beklenmez (allow_failure, bkz. yorum);
  # yayinin kendi temiz kopya taramasi asil secret kapisidir.
  needs: [iac-scan]
  image:
    name: $GITLEAKS_IMAGE
    entrypoint: [""]
    docker:
      user: root
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  resource_group: github-publish
  variables:
    GIT_STRATEGY: none
  script:
    - |
      set -eu
      apk add --no-cache git-filter-repo >/dev/null
      # Lab CA yalnizca GitLab klonu icin; GitHub push genel CA paketiyle dogrulanir.
      git -c http.sslCAInfo="$CI_SERVER_TLS_CA_FILE" clone -q --single-branch --branch "$CI_DEFAULT_BRANCH" \
        "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" /tmp/pub
      cd /tmp/pub
      git filter-repo --force --invert-paths --path infra/ansible/secrets/ --path-glob 'infra/ansible/inventory/group_vars/*/vault.yml'
      if git log --all --name-only --format= | grep -E '(^|/)secrets/|group_vars/[^/]+/vault\.yml$|\.vault$'; then
        echo "HATA: secret dosyasi gecmiste kaldi, yayinlanmadi"; exit 1
      fi
      gitleaks git --redact .
      git push -q "https://${GITHUB_USER}:${GITHUB_MIRROR_TOKEN}@github.com/${GITHUB_USER}/securestream-infra.git" HEAD:refs/heads/main
      echo "GitHub'a yayinlandi: $(git rev-parse --short HEAD) ($(git rev-list --count HEAD) commit)"
