# Yalnizca SecureStream pipeline'inin cosign anahtariyla imzaladigi ve SLSA v1 build provenance'i olan imajlar
# calisabilir. Provenance ayni anahtarla imzali olmali; kaynak securestream grubundaki bir GitLab reposu, builder
# lab runner'i olmali (catalog-api: ci/slsa-provenance.sh, docs/slsa-build-type.md).
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: verify-securestream-images
spec:
  validationActions: [Deny]
  webhookConfiguration:
    timeoutSeconds: 15
  matchConstraints:
    resourceRules:
      - apiGroups: ['']
        apiVersions: ['v1']
        operations: ['CREATE']
        resources: ['pods']
  matchImageReferences:
    - glob: 'registry.securestream.lab/securestream/*'
  credentials:
    secrets: [registry-pull]
  attestors:
    - name: cosign
      cosign:
        key:
          data: |
            -----BEGIN PUBLIC KEY-----
            MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEFg+9iBlPKmxB0tWFNH6exYVWYQ5m
            s+i2GydEXqhAEOyNqNCbIxwKB3GVaVajECA850F8sOUZrZyOQ3QZ/h7/dA==
            -----END PUBLIC KEY-----
        ctlog:
          # Lab: imzalar kamuya acik Rekor loguna yazilmiyor (--tlog-upload=false).
          insecureIgnoreTlog: true
          insecureIgnoreSCT: true
  attestations:
    - name: slsa
      intoto:
        type: https://slsa.dev/provenance/v1
  validations:
    - expression: >-
        images.containers.map(image, verifyImageSignatures(image, [attestors.cosign])).all(e, e > 0)
      message: 'Imza dogrulanamadi: yalnizca SecureStream pipeline imzali imajlar calisabilir'
    # extractPayload yalnizca imzasi dogrulanmis attestation icin calisir
    - expression: >-
        images.containers.map(image,
          verifyAttestationSignatures(image, attestations.slsa, [attestors.cosign]) > 0
            ? extractPayload(image, attestations.slsa).predicate.buildDefinition.externalParameters.source.uri
                .startsWith('git+https://gitlab.securestream.lab/securestream/')
              && extractPayload(image, attestations.slsa).predicate.runDetails.builder.id
                == 'https://gitlab.securestream.lab/securestream/gitlab-runner/docker-unprivileged'
            : false
        ).all(e, e)
      message: 'SLSA provenance yok ya da gecersiz: imaj securestream GitLab pipeline provenance attestation tasimali'
