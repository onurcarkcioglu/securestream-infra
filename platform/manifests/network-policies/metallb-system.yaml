# MetalLB: varsayilan giris yasak; controller webhook'u yalnizca API sunucusundan. Speaker hostNetwork'te calisir
# (NetworkPolicy host agindaki pod'lara uygulanmaz).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: metallb-system
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-apiserver-to-webhook
  namespace: metallb-system
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: metallb, app.kubernetes.io/component: controller }
  policyTypes: [Ingress]
  ingress:
    - from:
        # API sunucusu (yalnizca ss-k3s-cp): dugum IP, flannel.1 (baska dugume), cni0 (ayni dugume)
        - ipBlock: { cidr: 10.10.10.20/32 }
        - ipBlock: { cidr: 10.42.0.0/32 }
        - ipBlock: { cidr: 10.42.0.1/32 }
      ports: [{ port: 9443, protocol: TCP }]
