# cert-manager: varsayilan giris yasak; webhook yalnizca API sunucusundan, metrikler yalnizca Prometheus'tan.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: cert-manager
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-apiserver-to-webhook
  namespace: cert-manager
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: webhook, app.kubernetes.io/instance: cert-manager }
  policyTypes: [Ingress]
  ingress:
    - from:
        # API sunucusu (yalnizca ss-k3s-cp): dugum IP, flannel.1 (baska dugume), cni0 (ayni dugume)
        - ipBlock: { cidr: 10.10.10.20/32 }
        - ipBlock: { cidr: 10.42.0.0/32 }
        - ipBlock: { cidr: 10.42.0.1/32 }
      ports: [{ port: https, protocol: TCP }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-metrics
  namespace: cert-manager
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: monitoring }
          podSelector:
            matchLabels: { app.kubernetes.io/name: prometheus }
      ports: [{ port: http-metrics, protocol: TCP }]
