# External Secrets: varsayilan giris yasak; webhook yalnizca API sunucusundan.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: external-secrets
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-apiserver-to-webhook
  namespace: external-secrets
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: external-secrets-webhook }
  policyTypes: [Ingress]
  ingress:
    - from:
        # API sunucusu (yalnizca ss-k3s-cp): dugum IP, flannel.1 (baska dugume), cni0 (ayni dugume)
        - ipBlock: { cidr: 10.10.10.20/32 }
        - ipBlock: { cidr: 10.42.0.0/32 }
        - ipBlock: { cidr: 10.42.0.1/32 }
      ports: [{ port: webhook, protocol: TCP }]
