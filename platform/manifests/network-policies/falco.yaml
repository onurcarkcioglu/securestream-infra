# Falco: varsayilan giris yasak; Falcosidekick yalnizca Falco pod'larindan (olay) ve Prometheus'tan (metrik).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: falco
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-falco-to-sidekick
  namespace: falco
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: falcosidekick }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: falco }
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: monitoring }
          podSelector:
            matchLabels: { app.kubernetes.io/name: prometheus }
      ports: [{ port: http, protocol: TCP }]
