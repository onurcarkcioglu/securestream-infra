# ESO bu kimlikle Vault'a girer: statik token yok, kisa omurlu ve audience'a bagli Kubernetes token'i.
apiVersion: v1
kind: ServiceAccount
metadata: { name: catalog-eso, namespace: catalog }
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata: { name: vault, namespace: catalog }
spec:
  provider:
    vault:
      server: https://vault.securestream.lab:8200
      path: secret
      version: v2
      caProvider: { type: ConfigMap, name: lab-root-ca, key: ca.crt }
      auth:
        kubernetes:
          mountPath: kubernetes
          role: catalog
          serviceAccountRef:
            name: catalog-eso
            audiences: ["vault"]
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: catalog-config, namespace: catalog }
spec:
  refreshInterval: 1h
  secretStoreRef: { name: vault, kind: SecretStore }
  target: { name: catalog-config, creationPolicy: Owner }
  data:
    - secretKey: CATALOG_API_KEY
      remoteRef: { key: catalog/config, property: api_key }
