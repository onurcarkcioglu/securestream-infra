# Izleme is yukleri host erisimi istemez: PSA baseline zorlanir, restricted uyarir.
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
# node-exporter host ag/PID ve salt okunur host mount'lari ister (/proc, /sys, /); restricted/baseline uygulanamaz.
# Gerekceli istisna: docs/security-controls.md, "Pod Security Admission exceptions". Namespace'te baska is yuku yok.
apiVersion: v1
kind: Namespace
metadata:
  name: node-exporter
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: baseline
    pod-security.kubernetes.io/audit: baseline
