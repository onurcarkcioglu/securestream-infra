# Loki tek ikili (SingleBinary), dosya sistemi depolama, tek kiraci. Lab: replikasyon 1, 7 gun saklama.
deploymentMode: SingleBinary
loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2026-10-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  limits_config:
    retention_period: 168h
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
singleBinary:
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }
  persistence:
    enabled: true
    storageClass: local-path
    size: 10Gi
# Olceklenebilir modlar kapali
read: { replicas: 0 }
write: { replicas: 0 }
backend: { replicas: 0 }
# Tek ikili dogrudan 3100'de; gateway, onbellekler, canary ve test podu gereksiz
gateway: { enabled: false }
chunksCache: { enabled: false }
resultsCache: { enabled: false }
lokiCanary: { enabled: false }
test: { enabled: false }
